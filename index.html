<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff8a65" />
  <title>自媒体创作工作台</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- 左侧纵向导航栏 -->
    <nav class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo">🐾</div>
        <div class="brand-name">创作台</div>
      </div>
      <ul class="nav-list">
        <li class="nav-item active" data-view="viral">
          <span class="nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M13.5 1.5c.7 2.3-.4 4-1.8 5.2C9.9 8.2 8 9.7 8 12.5c0 .7.1 1.3.4 1.9-1.4-.5-2.6-1.7-2.6-3.3 0-1.3.7-2.3 1.5-3.2C6.2 6.4 5 7.6 5 9.4c0 1.7 1 3 2.3 3.7-1.4 1.2-3.3 1.9-5.3 1.9 2.6 2.2 5.9 3.5 9.5 3.5 5.2 0 9.5-3.4 9.5-8.1 0-3.8-2.6-6.3-5.1-8.3-1.8-1.4-3.4-2.7-3.4-4.6 0-1 0-1.9 0-1.9z"/></svg>
          </span>
          <span class="nav-label-full">今日爆款视频</span>
          <span class="nav-label-short">爆款</span>
        </li>
        <li class="nav-item" data-view="topic">
          <span class="nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M9 21c0 .5.4 1 1 1h4c.6 0 1-.5 1-1v-1H9v1zm3-19C8.1 2 5 5.1 5 9c0 2.4 1.3 4.4 3.2 5.6L8.5 16h7l.3-1.4C17.7 13.4 19 11.4 19 9c0-3.9-3.1-7-7-7zm0 2c2.8 0 5 2.2 5 5 0 1.3-.6 2.4-1.5 3.3l-.6.5-.2.7h-5.4l-.2-.7-.6-.5C8.6 13.4 8 12.3 8 11c0-2.8 2.2-5 5-5z"/></svg>
          </span>
          <span class="nav-label-full">今日视频选题</span>
          <span class="nav-label-short">选题</span>
        </li>
        <li class="nav-item" data-view="make">
          <span class="nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3a9 9 0 109 9h-2a7 7 0 11-7-7V3zm1 4h-2v6l5 3 .9-1.6L13 11.2V7z"/></svg>
          </span>
          <span class="nav-label-full">今日视频制作</span>
          <span class="nav-label-short">制作</span>
        </li>
        <li class="nav-item" data-view="publish">
          <span class="nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 20v-2l11-11 2 2L5 20H3zm14.7-13.3l-2-2 1.4-1.4c.8-.8 2-.8 2.8 0l.9.9c.8.8.8 2 0 2.8L17.7 6.7z"/></svg>
          </span>
          <span class="nav-label-full">今日视频发布</span>
          <span class="nav-label-short">发布</span>
        </li>
        <li class="nav-item" data-view="stats">
          <span class="nav-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 20h16v2H4v-2zm1-7h3v5H5v-5zm5-5h3v10h-3V8zm5-3h3v13h-3V5z"/></svg>
          </span>
          <span class="nav-label-full">今日数据盘点</span>
          <span class="nav-label-short">盘点</span>
        </li>
      </ul>
      <button class="nav-backup" id="btnBackup" title="云端备份/恢复">
        <span class="nav-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 3l7 3v5c0 4.5-3 8.3-7 9.3-4-1-7-4.8-7-9.3V6l7-3zm0 2.2L6 7.4V11c0 3.5 2.3 6.6 6 7.6 3.7-1 6-4.1 6-7.6V7.4L12 5.2zM11 9h2v3h3v2h-3v3h-2v-3H8v-2h3V9z"/></svg>
        </span>
        <span class="nav-label-full">云端备份</span>
        <span class="nav-label-short">备份</span>
      </button>
    </nav>

    <!-- 主内容区 -->
    <main class="content">
      <header class="topbar">
        <h1 class="topbar-title" id="viewTitle">今日爆款视频</h1>
        <div class="topbar-sub" id="viewSub">选题灵感来源</div>
      </header>

      <section class="view active" id="view-viral"></section>
      <section class="view" id="view-topic"></section>
      <section class="view" id="view-make"></section>
      <section class="view" id="view-publish"></section>
      <section class="view" id="view-stats"></section>

      <div class="safe-bottom"></div>
    </main>
  </div>

  <!-- 模态层 -->
  <div class="modal-root" id="modalRoot" hidden>
    <div class="modal-mask" id="modalMask"></div>
    <div class="modal-card" id="modalCard" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="seed.js"></script>
  <script src="app.js"></script>
</body>
</html>
